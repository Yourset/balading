name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 签名是可选的：仓库配了 secrets 就出正式签名包，
      # 没配（例如刚 fork 过来）就出未签名 APK，构建照样通过。
      - name: Restore signing keystore (optional)
        id: signing
        shell: bash
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "${ANDROID_SIGNING_KEY_BASE64:-}" ]; then
            echo "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > android/app/release-signing.p12
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "已载入签名密钥，将构建正式签名 APK。"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "未配置 ANDROID_SIGNING_KEY_BASE64，将构建未签名 APK（安装前需自行签名）。"
          fi

      - name: Install web deps
        working-directory: web
        run: npm install

      - name: Build web frontend
        working-directory: web
        run: npm run build

      - name: Upload web hot-update artifact
        uses: actions/upload-artifact@v4
        with:
          name: balading-web
          path: web/dist
          if-no-files-found: error

      - name: Install Capacitor deps
        run: npm install

      - name: Capacitor sync android
        run: npx cap sync android

      - name: Compute monotonic Android version
        id: android-version
        shell: bash
        run: |
          echo "code=$((2000000000 + $(date -u +%s) / 60))" >> "$GITHUB_OUTPUT"
          echo "name=1.2.$(date -u +'%Y%m%d.%H%M')" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ steps.signing.outputs.available == 'true' && format('{0}/android/app/release-signing.p12', github.workspace) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.android-version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.android-version.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: balading-apk
          # 签名包是 app-release.apk，未签名包是 app-release-unsigned.apk，两者都收
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
